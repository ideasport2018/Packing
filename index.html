<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top">
<title>บันทึกการแพ็คประจำวัน ปี 2569</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--ink:#1c2a26;--mu:#6b7872;--line:#e4e0d6;--acc:#0f6b5c;--soft:#e3f1ed;--bad:#b3372f}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 'Noto Sans Thai',Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header img{height:38px}#lgo{height:96px;margin-bottom:6px}.c{width:34px;color:var(--mu)}.mi{padding:4px 9px}.t{font-weight:700}.mu{color:var(--mu)}
nav{display:flex;gap:4px;flex-wrap:wrap;width:100%}@media(min-width:800px){nav{width:auto;margin-left:10px}}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--mu);font:inherit;font-weight:600}
nav button.on{background:var(--soft);color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;min-width:0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.gh{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px}.dg{border-color:#e5b9b4;color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.kp small{color:var(--mu);display:block}.kp b{font-size:22px}
table{width:100%;border-collapse:collapse}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mu);font-size:13px}.n{text-align:right}
tr.lk{cursor:pointer}tr.lk:hover td{background:var(--soft)}
.lay{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start}@media(max-width:800px){.lay{grid-template-columns:1fr}}
.dr{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;cursor:pointer}.dr.on{background:var(--soft);color:var(--acc);font-weight:600}
.it{position:relative;display:grid;grid-template-columns:1.5fr 1fr 1.2fr 1.1fr .7fr .7fr .8fr 1fr 38px;gap:6px;align-items:end;padding:6px 0;border-bottom:1px solid var(--line)}
.it label{display:none;font-size:12px;color:var(--mu)}.it.h{font-size:13px;color:var(--mu);font-weight:600}
.am{text-align:right;font-weight:600;padding:9px 0}
@media(max-width:800px){.it.h{display:none}.it{grid-template-columns:1fr 1fr;padding:12px 0}.it label{display:block}.it .w{grid-column:1/-1}.it>.w:first-child{padding-right:44px}.it .x{position:absolute;top:30px;right:0}}
.bar{height:6px;background:var(--acc);border-radius:3px;min-width:2px}
.foot{display:flex;gap:6px 20px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:12px}
.foot label{display:flex;gap:6px;align-items:center}.foot input{width:auto}
</style></head><body>

function rEd(){const d=day(sel);
 $('#ol').innerHTML=[...new Set(Object.values(S.days).flatMap(x=>x.items.map(i=>i.order)).filter(Boolean))].map(v=>`<option value="${E(v)}">`).join('');

 <div class="card"><div class="it h"><span>ชื่อรายการ</span><span>แบรนด์</span><span>งานที่ทำ</span><span>ประเภทเสื้อ</span><span class="n">ยอดงาน</span><span class="n">ราคา/งาน</span><span class="n">ยอดรวม</span><span>เพิ่มเติม</span><span></span></div>

const tp=t=>{const c=S.cfg.types.find(x=>x.name==t);return c&&c.price!=null&&c.price!==''?+c.price:null};
function price4(j,t){if(!j&&!t)return null;const p=tp(t);if(p!==null)return p;
 for(const k of Object.keys(S.days).sort().reverse())for(const i of S.days[k].items)if(i.job==j&&i.type==t&&i.price!==''&&i.price!=null)return +i.price;return null}
document.addEventListener('input',e=>{const t=e.target,r=t.closest&&t.closest('.it[data-i]');if(!r||!t.dataset.f||t.tagName==='SELECT')return;day(sel).items[r.dataset.i][t.dataset.f]=t.value;upd();sv()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='rd'){day(sel).round=t.checked;upd();sv();return}
 const r=t.closest&&t.closest('.it[data-i]');if(!r||t.tagName!=='SELECT')return;const it=day(sel).items[r.dataset.i];

  if(np!==null&&(it.price===''||(op!==null&&+it.price===op))){it.price=np;r.querySelector('[data-f=price]').value=np}}else it[t.dataset.f]=t.value;upd();sv()});
/* save */
let tm=null,pk='',q=Promise.resolve();
function sv(){pk=sel;clearTimeout(tm);st('กำลังบันทึก…');tm=setTimeout(fl,700)}
function fl(){if(!pk)return;clearTimeout(tm);const k=pk,d=S.days[k],tk=tok;pk='';

addEventListener('beforeunload',fl);
/* summaries */
function agg(ks){const r={n:ks.length,q:0,m:0,p:0,rn:0,j:{},t:{},o:{},b:{}};ks.forEach(k=>{const d=S.days[k];r.m+=net(d);r.p+=tot(d);if(d.round&&net(d)>tot(d))r.rn++;d.items.forEach(i=>{const q=+i.qty||0,a=amt(i);r.q+=q;
 [['j',i.job],['t',i.type],['o',i.order],['b',i.brand]].forEach(([x,n])=>{n=String(n||'').trim()||'(ไม่ระบุ)';const e=r[x][n]||(r[x][n]={n,q:0,a:0});e.q+=q;e.a+=a})})});r.m=r2(r.m);r.p=r2(r.p);r.rd=r2(r.m-r.p);return r}
const tb=(h,rows)=>`<div style="overflow-x:auto"><table><tr>${h.map((x,i)=>`<th class="${i?'n':''}">${x}</th>`).join('')}</tr>${rows}</table></div>`;
const kp=a=>`<div class="kp">${a.map(([l,v,u])=>`<div><small>${l}</small><b>${v}</b> <span class="mu">${u||''}</span></div>`).join('')}</div>`;
const grp=(t,o)=>`<div class="card"><h3>แยกตาม${t}</h3>${tb([t,'ยอดงาน (ตัว)','ยอดรวม (บาท)'],Object.values(o).sort((a,b)=>b.a-a.a).map(e=>`<tr><td>${E(e.n)}</td><td class="n">${M(e.q)}</td><td class="n">${M(e.a)}</td></tr>`).join(''))}</div>`;

 const A=agg(ks);
 h+=own()?kp([['วันทำงาน',A.n,'วัน'],['ยอดงานทั้งหมด',M(A.q),'ตัว'],['ยอดก่อนปัดเศษ',M(A.p),'บาท'],['ยอดที่ปัดเพิ่ม ('+A.rn+' วัน)','+'+M(A.rd),'บาท'],['ยอดเงินรวมของเดือน (หลังปัด)',M(A.m),'บาท'],['เฉลี่ยต่อวัน',M(A.m/A.n),'บาท']]):kp([['วันทำงาน',A.n,'วัน'],['ยอดเงินที่ได้ในเดือนนี้',M(A.m),'บาท']]);
 if(own())h+=`<div class="row" style="align-items:flex-start"><div style="flex:1;min-width:280px">${grp('งานที่ทำ',A.j)}</div><div style="flex:1;min-width:280px">${grp('ประเภทเสื้อ',A.t)}</div></div>${grp('แบรนด์',A.b)}${grp('ชื่อรายการ',A.o)}<p class="mu">ยอดแยกกลุ่มเป็นยอดก่อนปัดเศษ</p>`;
 h+=`<div class="card"><h3>รายวัน <span class="mu">(กดเพื่อเปิดแก้ไข)</span></h3>${tb(own()?['วันที่','ยอดงาน (ตัว)','ยอดก่อนปัด','ปัดเพิ่ม','ยอดเงิน (บาท)']:['วันที่','ยอดเงิน (บาท)'],
  ks.map(k=>{const d=S.days[k];return `<tr class="lk" onclick="go('${k}')"><td>${dL(k)}${d.round?' <span class="mu">(ปัดขึ้น)</span>':''}</td>${own()?`<td class="n">${M(qty(d))}</td><td class="n">${M(tot(d))}</td><td class="n">${r2(net(d)-tot(d))>0?'+'+M(net(d)-tot(d)):'—'}</td>`:''}<td class="n">${M(net(d))}</td></tr>`}).join(''))}</div>`;

  trow(ws,tr,9,'รวมทั้งเดือน');T(ws,tr,6,F(`SUM(F4:F${r1})`,r2(rows.reduce((a,[k,i])=>a+(+i.qty||0),0))));T(ws,tr,8,F(`SUM(H4:H${r1})`,r2(rows.reduce((a,[k,i])=>a+amt(i),0))),NF);

 put(sum,sr+1,1,'หมายเหตุ: ยอดสุทธิคิดจากยอดรายวันหลังปัดเศษขึ้น (เฉพาะวันที่ติ๊ก) ส่วนตารางแยกตามด้านล่างเป็นยอดก่อนปัดเศษ');
 let gr=sr+4;const COLS={brand:'C',job:'D',type:'E'},cn=ms.length,lc=k=>String(k||'').trim().toLowerCase();
